name: Streamlit Auto Wake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit or wake Streamlit app
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["STREAMLIT_APP_URL"]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(5000)

              wake_button = page.get_by_role(
                  "button",
                  name="Yes, get this app back up!"
              )

              if wake_button.count() > 0:
                  print("Sleeping app detected.")
                  wake_button.first.click()
                  print("Wake-up button clicked.")
              else:
                  print("No wake-up button detected.")

              page.wait_for_timeout(15000)
              print("Current page:", page.url)
              print("Page title:", page.title())

              browser.close()
          PY
