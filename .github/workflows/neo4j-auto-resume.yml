
name: Neo4j Aura Auto Resume

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  resume-neo4j:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check and resume Neo4j Aura
        env:
          AURA_CLIENT_ID: ${{ secrets.AURA_CLIENT_ID }}
          AURA_CLIENT_SECRET: ${{ secrets.AURA_CLIENT_SECRET }}
          AURA_INSTANCE_ID: ${{ secrets.AURA_INSTANCE_ID }}
        run: |
          python3 - <<'PY'
          import os
          import requests

          base = "https://api.neo4j.io"
          instance_id = os.environ["AURA_INSTANCE_ID"]

          auth = requests.post(
              f"{base}/oauth/token",
              auth=(
                  os.environ["AURA_CLIENT_ID"],
                  os.environ["AURA_CLIENT_SECRET"]
              ),
              data={"grant_type": "client_credentials"},
              timeout=30
          )
          auth.raise_for_status()

          token = auth.json()["access_token"]
          headers = {"Authorization": f"Bearer {token}"}

          response = requests.get(
              f"{base}/v1/instances/{instance_id}",
              headers=headers,
              timeout=30
          )
          response.raise_for_status()

          status = response.json()["data"]["status"]
          print(f"Neo4j status: {status}")

          if status.lower() == "paused":
              print("Resuming Neo4j...")
              result = requests.post(
                  f"{base}/v1/instances/{instance_id}/resume",
                  headers=headers,
                  timeout=30
              )
              result.raise_for_status()
              print("Resume request accepted.")
          else:
              print("No resume action needed.")
          PY

      - name: Install Neo4j Driver
        run: pip install neo4j

      - name: Verify Neo4j Connectivity
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
        run: |
          python3 - <<'PY'
          import os
          import time
          from neo4j import GraphDatabase

          uri = os.environ["NEO4J_URI"]
          user = os.environ["NEO4J_USERNAME"]
          password = os.environ["NEO4J_PASSWORD"]
          database = os.environ["NEO4J_DATABASE"]

          for attempt in range(1, 13):
              try:
                  with GraphDatabase.driver(
                      uri,
                      auth=(user, password),
                      connection_timeout=10
                  ) as driver:
                      with driver.session(
                          database=database
                      ) as session:
                          result = session.run(
                              "RETURN 1 AS health_check"
                          ).single()

                          assert result["health_check"] == 1

                  print("Neo4j connectivity verified!")
                  break

              except Exception as e:
                  print(
                      f"Attempt {attempt}/12 failed: "
                      f"{type(e).__name__}"
                  )

                  if attempt == 12:
                      raise

                  time.sleep(30)
          PY
