[project]
name = "threatgraph-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Moumita Sen Sarma", email = "moumitactg@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.28.1",
    "neo4j>=5.28.5",
    "openai>=2.48.0",
    "pydantic>=2.13.5",
    "pytest>=8.4.2",
    "python-dotenv>=1.2.1",
    "qdrant-client>=1.16.1",
    "ruff>=0.16.7",
    "sentence-transformers>=5.1.2",
    "stix2>=3.0.1",
]

[project.scripts]
threatgraph-rag = "threatgraph_rag:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
