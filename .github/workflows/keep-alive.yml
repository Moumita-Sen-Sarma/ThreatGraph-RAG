name: Keep ThreatGraph Services Active

on:
  workflow_dispatch:

jobs:
  test-streamlit:
    runs-on: ubuntu-latest

    steps:
      - name: Test Streamlit URL
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          echo "Testing Streamlit URL..."

          if [ -z "$STREAMLIT_APP_URL" ]; then
            echo "STREAMLIT_APP_URL secret is empty or missing."
            exit 1
          fi

          curl \
            -L \
            --connect-timeout 20 \
            --max-time 60 \
            "$STREAMLIT_APP_URL" \
            -o /dev/null \
            -w "HTTP status: %{http_code}\n"
