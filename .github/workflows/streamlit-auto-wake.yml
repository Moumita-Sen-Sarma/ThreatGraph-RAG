
name: Streamlit Auto Wake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Diagnose Streamlit page
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["STREAMLIT_APP_URL"]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              try:
                  response = page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  page.wait_for_timeout(10000)

                  print("HTTP status:",
                        response.status if response else "N/A")
                  print("Page title:", page.title())
                  print("Current URL:", page.url)

                  print("Streamlit containers:",
                        page.locator(
                            '[data-testid="stAppViewContainer"]'
                        ).count())

                  print("Frames:", len(page.frames))

                  print("Visible buttons:")
                  for button in page.get_by_role("button").all()[:10]:
                      print("-", button.inner_text()[:100])

                  print("Body text (first 1000 chars):")
                  print(page.locator("body").inner_text()[:1000])

              finally:
                  browser.close()
          PY
