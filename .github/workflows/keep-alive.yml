name: Keep ThreatGraph Services Active

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  # Lets you run it manually from GitHub Actions
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit app
        run: |
          echo "Pinging Streamlit..."
          curl -L \
            --connect-timeout 20 \
            --max-time 60 \
            --retry 2 \
            "${{ secrets.STREAMLIT_APP_URL }}" \
            -o /dev/null

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Neo4j driver
        run: |
          pip install neo4j

      - name: Check AuraDB and generate activity
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
        run: |
          python - <<'PY'
          import os
          import sys

          from neo4j import GraphDatabase

          uri = os.environ["NEO4J_URI"]
          username = os.environ["NEO4J_USERNAME"]
          password = os.environ["NEO4J_PASSWORD"]
          database = os.environ.get("NEO4J_DATABASE", "neo4j")

          try:
              driver = GraphDatabase.driver(
                  uri,
                  auth=(username, password),
              )

              with driver.session(database=database) as session:
                  result = session.run(
                      "RETURN 1 AS health"
                  ).single()

                  print(
                      "AuraDB health check:",
                      result["health"],
                  )

              driver.close()

          except Exception as exc:
              print(
                  "AuraDB connection failed:",
                  type(exc).__name__,
              )
              sys.exit(1)
          PY
