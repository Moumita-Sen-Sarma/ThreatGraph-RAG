name: Streamlit Auto Wake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit and verify Streamlit app
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          python - <<'PY'
          import os
          import time
          from playwright.sync_api import sync_playwright

          url = os.environ["STREAMLIT_APP_URL"]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              try:
                  for attempt in range(1, 4):
                      print(f"Attempt {attempt}/3")

                      page.goto(
                          url,
                          wait_until="domcontentloaded",
                          timeout=60000
                      )

                      wake_button = page.get_by_role(
                          "button",
                          name="Yes, get this app back up!"
                      )

                      if wake_button.count() > 0:
                          print("Sleeping app detected.")
                          wake_button.first.click()
                          print("Wake-up button clicked.")

                      try:
                          page.locator(
                              '[data-testid="stAppViewContainer"]'
                          ).wait_for(timeout=60000)

                          print(
                              "Streamlit application container detected!"
                          )
                          print("Current URL:", page.url)
                          break

                      except Exception:
                          print("Application not ready.")

                          if attempt == 3:
                              raise RuntimeError(
                                  "Streamlit app failed to load."
                              )

                          time.sleep(10)
              finally:
                  browser.close()
          PY
